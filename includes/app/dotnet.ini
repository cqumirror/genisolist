[dotnet-sdk]
distro = .NET
category = app
location = dotnet/*/*/dotnet-sdk-*
pattern = dotnet/\d+(?:\.\d+)?/(?!LatestRelease)([^/]+)/dotnet-sdk-(.+?)\.(exe|pkg)$
version = $1
platform = $2
type = sdk

