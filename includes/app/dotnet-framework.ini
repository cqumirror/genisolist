[dotnet-framework-web]
distro = .NET Framework
category = app
location = dotnet/dotnet-framework/*Web.exe
pattern = NDP(\d)(\d)(\d?).*Web\.exe$
version = $1.$2.$3
platform = win-x86
type = web-installer

[dotnet-framework-runtime-langpack]
distro = .NET Framework
category = app
location = dotnet/dotnet-framework/*AllOS*.exe
pattern = NDP(\d)(\d)(\d?).*AllOS-(CHS|CHT)\.exe$
version = $1.$2.$3
platform = win-x86_x64
type = runtime-langpack-$4

[dotnet-framework-devpack]
distro = .NET Framework
category = app
location = dotnet/dotnet-framework/NDP*DevPack*.exe
pattern = NDP(\d+).*DevPack.*-(ENU|CHS|CHT)\.exe$
version = $1
platform = win-x86_x64
type = developer-pack-$2

[dotnet-framework-targetingpack]
distro = .NET Framework
category = app
location = dotnet/dotnet-framework/*TargetingPack*.exe
pattern = NDP(\d)(\d)(\d?).*TargetingPack.*\.exe$
version = $1.$2.$3
platform = win-x86_x64
type = targeting-pack